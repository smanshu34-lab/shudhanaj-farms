<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shudhanaj Farms — Support</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Hind:wght@400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hind', sans-serif;
    background: #0d1a0f;
    background-image: radial-gradient(ellipse at top left, #0d2e10 0%, #0d1a0f 60%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .chat-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
    max-width: 480px;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-logo .leaf { font-size: 28px; }

  .brand-logo span {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: #86efac;
    letter-spacing: 0.5px;
  }

  .brand-logo small {
    font-size: 11px;
    color: #4ade80;
    letter-spacing: 2px;
    text-transform: uppercase;
    display: block;
    margin-top: -4px;
  }

  .chat-container {
    width: 100%;
    background: #111f13;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 0 80px rgba(34,197,94,0.15), 0 0 0 1px rgba(74,222,128,0.12);
    display: flex;
    flex-direction: column;
    height: 620px;
  }

  .chat-header {
    background: linear-gradient(135deg, #15803d 0%, #16a34a 60%, #22c55e 100%);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 13px;
    position: relative;
    overflow: hidden;
  }

  .chat-header::before {
    content: '🌾';
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 36px;
    opacity: 0.25;
  }

  .avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .header-info h2 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: #fff;
    line-height: 1.2;
  }

  .header-info p {
    font-size: 11.5px;
    color: rgba(255,255,255,0.8);
    margin-top: 1px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  .status {
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 3px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #bbf7d0;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 3px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: rgba(74,222,128,0.2); border-radius: 2px; }

  .msg {
    display: flex;
    gap: 8px;
    max-width: 90%;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.bot { align-self: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #15803d, #22c55e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 3px;
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.6;
  }

  .msg.bot .bubble {
    background: #1a2e1c;
    color: #d1fae5;
    border-bottom-left-radius: 4px;
    border: 1px solid rgba(74,222,128,0.12);
  }

  .msg.user .bubble {
    background: linear-gradient(135deg, #15803d, #16a34a);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 11px 14px;
    background: #1a2e1c;
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    border: 1px solid rgba(74,222,128,0.12);
    width: fit-content;
  }

  .typing-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
    animation: bounce 1.2s infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    padding: 4px 14px 12px;
  }

  .quick-btn {
    background: #1a2e1c;
    border: 1px solid rgba(74,222,128,0.3);
    color: #86efac;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Hind', sans-serif;
    transition: all 0.18s;
    font-weight: 500;
  }

  .quick-btn:hover {
    background: rgba(34,197,94,0.15);
    border-color: #22c55e;
    color: #bbf7d0;
  }

  .divider {
    height: 1px;
    background: rgba(74,222,128,0.08);
    margin: 0 14px;
  }

  .input-area {
    padding: 12px 14px;
    background: #0d1a0f;
    display: flex;
    gap: 9px;
    align-items: center;
  }

  #userInput {
    flex: 1;
    background: #1a2e1c;
    border: 1px solid rgba(74,222,128,0.2);
    border-radius: 22px;
    padding: 10px 15px;
    color: #d1fae5;
    font-family: 'Hind', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  #userInput::placeholder { color: #2d5a35; }
  #userInput:focus { border-color: #22c55e; }

  #sendBtn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #15803d, #22c55e);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, opacity 0.2s;
    flex-shrink: 0;
  }

  #sendBtn:hover { transform: scale(1.08); }
  #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  #sendBtn svg { width: 17px; height: 17px; fill: white; }

  .footer-tag {
    font-size: 11px;
    color: #2d5a35;
    text-align: center;
    padding-bottom: 2px;
  }
</style>
</head>
<body>

<div class="chat-wrapper">
  <div class="brand-logo">
    <span class="leaf">🌿</span>
    <div>
      <span>Shudhanaj Farms</span>
      <small>Customer Support</small>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <div class="avatar">🌱</div>
      <div class="header-info">
        <h2>Kisan Sahayak — किसान सहायक</h2>
        <p>Shudhanaj Farms | Official Support</p>
        <div class="status">
          <div class="status-dot"></div>
          24/7 Online — Help ke liye ready hain!
        </div>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="quick-replies" id="quickReplies">
      <button class="quick-btn" onclick="sendQuick('Chawal ke baare mein batao')">🍚 Chawal</button>
      <button class="quick-btn" onclick="sendQuick('Atta ke baare mein batao')">🌾 Atta</button>
      <button class="quick-btn" onclick="sendQuick('Mera order kahan hai?')">📦 Order Track</button>
      <button class="quick-btn" onclick="sendQuick('Quality se problem hai')">😤 Quality Issue</button>
      <button class="quick-btn" onclick="sendQuick('Delivery nahi aayi abhi tak')">🚚 Delivery</button>
      <button class="quick-btn" onclick="sendQuick('Bulk order karna hai')">📋 Bulk Order</button>
    </div>

    <div class="divider"></div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Apna sawaal yahan likho... 🌿" />
      <button id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>

    <p class="footer-tag">Powered by Shudhanaj Farms © 2025</p>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const history = [];

  const systemPrompt = `Tu "Sahayak" hai — Shudhanaj Farms ka official customer support assistant. Shudhanaj Farms abhi naya launch hua hai aur sirf ek product sell karta hai — premium quality Chawal (Rice). Tu Hinglish mein baat karta hai — Hindi aur English milaake.

Teri personality:
- Warm, friendly aur helpful — jaise ek apna
- Simple aur seedhi baat — customers confuse na hon
- Honest raho — agar kuch nahi pata to clearly bol do
- Naye brand ke liye customer trust banana bahut zaroori hai

Company ke baare mein:
- Naam: Shudhanaj Farms
- Status: Naya launch, abhi growing hai!
- Do products hain abhi:
  1. Premium Shudhanaj Chawal (Rice) — 1kg, 5kg, 10kg
  2. Premium Shudhanaj Atta (Wheat Flour) — 1kg, 5kg, 10kg
- Dono ki khasiyat: Farm fresh, saaf aur shuddh, naturally grown, koi milawat nahi
- Delivery: 3-5 business days
- Refund policy: Quality se problem ho to 7 din ke andar contact karo — replacement denge
- Bulk orders: Zyada quantity chahiye to hume directly message karo
- Customer care: Abhi support is chatbot ke through hi hai

Common scenarios:
1. Product info → Sirf chawal hai — 1kg, 5kg, 10kg. Quality premium hai, farm fresh.
2. Order karna hai → Unhe website/app pe order karne ko bolo (ya jo bhi ordering channel ho)
3. Order tracking → Order ID maango, batao 3-5 din mein aayega
4. Quality issue → Pehle genuinely sorry bolo, photo maango, replacement ka promise karo
5. Refund → 7 din ke andar contact karo, quality issue pe full replacement milega
6. Bulk order → Note kar lo unki requirement
`;

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    const formatted = text.replace(/\n/g, '<br>');
    if (role === 'bot') {
      div.innerHTML = `<div class="msg-avatar">🌱</div><div class="bubble">${formatted}</div>`;
    } else {
      div.innerHTML = `<div class="bubble">${formatted}</div>`;
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'typing';
    div.innerHTML = `<div class="msg-avatar">🌱</div><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    sendBtn.disabled = true;
    document.getElementById('quickReplies').style.display = 'none';

    addMessage('user', text);
    history.push({ role: 'user', content: text });
    showTyping();

    try {
      // ================================================
      const GEMINI_API_KEY = 'AIzaSyA6ceGCv09tHdIEOxJolju_spKy4qpqLUY';
      // ================================================

      const geminiMessages = history.map(m => ({
        role: m.role === 'assistant' ? 'model' : 'user',
        parts: [{ text: m.content }]
      }));

      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: systemPrompt }] },
            contents: geminiMessages,
            generationConfig: { maxOutputTokens: 800 }
          })
        }
      );

      const data = await res.json();
      removeTyping();

      const reply = data.candidates?.[0]?.content?.parts?.[0]?.text
        || 'Kuch technical problem aa gayi. Thodi der baad try karein. 🙏';

      history.push({ role: 'assistant', content: reply });
      addMessage('bot', reply);

    } catch (e) {
      removeTyping();
      addMessage('bot', 'Network error aa gayi 😔 Kripya thodi der baad try karein.');
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }

  function sendQuick(text) {
    inputEl.value = text;
    sendMessage();
  }

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });

  addMessage('bot', 'Jai Kisan! 🌾 Namaste, main Sahayak hoon — Shudhanaj Farms ka support assistant.\n\nHum laate hain aapke liye:\n🍚 Premium Chawal — 1kg, 5kg, 10kg\n🌾 Premium Atta — 1kg, 5kg, 10kg\n\nKoi bhi sawaal ho — order, delivery, quality — main yahan hoon! Neeche se option choose karein. 👇');
</script>
</body>
</html>
